[project]
name = "barbellos-backend"
version = "0.1.0"
description = "BarbellOS: backend (FastAPI) aplikacji dieta + trening + regeneracja"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "itsdangerous>=2.2",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
# httpx2: klient używany przez TestClient w nowych wersjach Starlette.
dev = ["pytest>=8", "ruff>=0.6", "httpx2>=2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# FastAPI wstrzykuje zależności przez Depends(...) w wartościach domyślnych.
"app/api/*.py" = ["B008"]
