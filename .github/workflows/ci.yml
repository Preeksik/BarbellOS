name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  # Migracje i zapisy na prawdziwym Postgresie (na serwerze jest Postgres w Neon, lokalnie
  # testy idą na SQLite). Render wdraża nową wersję dopiero, gdy wszystkie zadania przejdą.
  backend-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: barbellos
          POSTGRES_PASSWORD: barbellos
          POSTGRES_DB: barbellos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U barbellos"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      POSTGRES_TEST_URL: postgresql://barbellos:barbellos@localhost:5432/barbellos_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      # -rs: wypisz pominięte testy; brak POSTGRES_TEST_URL nie może przejść po cichu.
      - run: pytest -q -rs tests/test_postgres.py
      - run: "! pytest -q -rs tests/test_postgres.py | grep -q SKIPPED"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
