# Blueprint dla Render (darmowy plan). Instrukcja krok po kroku: docs/wdrozenie.md.
# Sprawdzone z dokumentacją https://render.com/docs/blueprint-spec 18.11.2026.
#
# Baza: osobno w Neon (darmowy Postgres na Renderze wygasa po 30 dniach).
# Wartości `sync: false` wpisujesz w panelu Render przy tworzeniu (tylko raz; później
# zmieniasz je w zakładce Environment usługi).

services:
  - type: web
    name: barbellos
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/healthz
    # Nowa wersja wchodzi dopiero, gdy przejdą testy w GitHub Actions (w tym na Postgresie).
    autoDeployTrigger: checksPass
    envVars:
      - key: ENVIRONMENT
        value: prod
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: INGEST_TOKEN
        generateValue: true
      - key: APP_PASSWORD_HASH
        sync: false
      - key: OFF_USER_AGENT
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: FDC_API_KEY
        sync: false
